name: Apply Mesa BCC64X contract

on:
  push:
    branches:
      - mesa-bcc64x-contract
    paths:
      - .github/workflows/mesa-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mesa-bcc64x-contract
          fetch-depth: 0
      - name: Patch canonical contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin/programs/opengl/patch_contract.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          found = False
          for index, line in enumerate(lines):
              if line.startswith('pattern = re.compile('):
                  lines[index] = 'pattern = re.compile(r\'<library id="opengl".*?</library>\', re.DOTALL)'
                  found = True
                  break
          if not found:
              raise SystemExit('OpenGL selector line not found')
          text = '\n'.join(lines) + '\n'
          text = text.replace(
              'pattern.subn(mesa_block, text, count=1)',
              'pattern.subn(lambda _match: mesa_block, text, count=1)')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 admin/programs/opengl/patch_contract.py
      - name: Commit canonical contract
        shell: bash
        run: |
          git config user.name "BuildEngine contract update"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/mesa-contract-patch.yml admin/programs/opengl/patch_contract.py
          git add admin/build-libraries.xml admin/programs/opengl/meson_bootstrap.py
          git diff --cached --check
          git commit -m "Build Mesa OpenGL natively with BCC64X"
          git push origin HEAD:mesa-bcc64x-contract
