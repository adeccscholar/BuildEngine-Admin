name: Add Mesa Python build dependencies

on:
  push:
    branches:
      - opengl-python-build-deps
    paths:
      - .github/workflows/opengl-python-build-deps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opengl-python-build-deps
          fetch-depth: 0

      - name: Patch OpenGL source contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin/build-libraries.xml')
          text = path.read_text(encoding='utf-8')

          old = '''<library id="opengl" version="26.2.1" timestamp="2026-09-02T01:02:00Z">'''
          new = '''<library id="opengl" version="26.2.1" timestamp="2026-09-02T01:18:00Z">'''
          if text.count(old) != 1:
              raise SystemExit('OpenGL timestamp marker mismatch')
          text = text.replace(old, new, 1)

          marker = '''         <extract format="libarchive" root="meson-1.12.0" merge="true" preserveCurrentArtifact="true">
            <require path="meson.py"/>
            <require path="mesonbuild\\mesonmain.py"/>
            <require path="COPYING"/>
         </extract>
         <copy source="{BuildFileDir}\\programs\\opengl\\meson_bootstrap.py" target="{Workspace}\\.buildengine\\meson_bootstrap.py" overwrite="true" preserveCurrentArtifact="true"/>
'''

          replacement = '''         <extract format="libarchive" root="meson-1.12.0" merge="true" preserveCurrentArtifact="true">
            <require path="meson.py"/>
            <require path="mesonbuild\\mesonmain.py"/>
            <require path="COPYING"/>
         </extract>

         <!-- Mesa's mandatory Python configure-time modules. Keep them pinned and
              source-local so the build does not depend on global pip/site-packages. -->
         <download url="https://files.pythonhosted.org/packages/7d/fa/3944b40b07da9ce895c0e6303a5ab7d53da063554f534556b134a54d6093/packaging-26.3.tar.gz" archive="packaging-26.3.tar.gz" sha256="94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"/>
         <extract format="libarchive" root="packaging-26.3" merge="true" preserveCurrentArtifact="true">
            <require path="src\\packaging\\__init__.py"/>
            <require path="src\\packaging\\version.py"/>
            <require path="LICENSE"/>
         </extract>

         <download url="https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz" archive="markupsafe-3.0.3.tar.gz" sha256="722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"/>
         <extract format="libarchive" root="markupsafe-3.0.3" merge="true" preserveCurrentArtifact="true">
            <require path="src\\markupsafe\\__init__.py"/>
            <require path="src\\markupsafe\\_native.py"/>
            <require path="LICENSE.txt"/>
         </extract>

         <download url="https://files.pythonhosted.org/packages/2a/12/b5fa2353e2754cd67fb9f83793fa48ff42c213a5da7e719869d2301f6ab8/mako-1.4.1.tar.gz" archive="mako-1.4.1.tar.gz" sha256="d7904710b662996425a21627710c4777c45053146942cf8a7aebf757c92b8c27"/>
         <extract format="libarchive" root="mako-1.4.1" merge="true" preserveCurrentArtifact="true">
            <require path="mako\\__init__.py"/>
            <require path="mako\\filters.py"/>
            <require path="LICENSE"/>
         </extract>

         <download url="https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz" archive="pyyaml-6.0.3.tar.gz" sha256="d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"/>
         <extract format="libarchive" root="pyyaml-6.0.3" merge="true" preserveCurrentArtifact="true">
            <require path="lib\\yaml\\__init__.py"/>
            <require path="lib\\yaml\\loader.py"/>
            <require path="LICENSE"/>
         </extract>

         <copy source="{BuildFileDir}\\programs\\opengl\\meson_bootstrap.py" target="{Workspace}\\.buildengine\\meson_bootstrap.py" overwrite="true" preserveCurrentArtifact="true"/>
'''
          if text.count(marker) != 1:
              raise SystemExit('Meson source marker mismatch')
          text = text.replace(marker, replacement, 1)

          env_marker = '''         <environment name="WINDRES" value="{Tool:bcc64x-windres}"/>
         <environment name="PATH" value="{ToolDir:bcc64x};{ToolDir:llvm-ar};{ToolDir:bcc64x-windres};{ToolDir:ninja};{ToolDir:python};{ENV:PATH}"/>
'''
          env_replacement = '''         <environment name="WINDRES" value="{Tool:bcc64x-windres}"/>
         <environment name="PYTHONPATH" value="{Workspace}\\packaging-26.3\\src;{Workspace}\\markupsafe-3.0.3\\src;{Workspace}\\mako-1.4.1;{Workspace}\\pyyaml-6.0.3\\lib"/>
         <environment name="PATH" value="{ToolDir:bcc64x};{ToolDir:llvm-ar};{ToolDir:bcc64x-windres};{ToolDir:ninja};{ToolDir:python};{ENV:PATH}"/>
'''
          if text.count(env_marker) != 1:
              raise SystemExit('OpenGL environment marker mismatch')
          text = text.replace(env_marker, env_replacement, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check

      - name: Commit OpenGL dependency contract
        shell: bash
        run: |
          git config user.name "BuildEngine Mesa dependencies"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/opengl-python-build-deps.yml
          git add admin/build-libraries.xml
          git diff --cached --check
          git commit -m "Pin Mesa Python configure dependencies"
          git push origin HEAD:opengl-python-build-deps
