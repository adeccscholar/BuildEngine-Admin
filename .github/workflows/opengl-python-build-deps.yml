name: Add Mesa Python build dependencies

on:
  push:
    branches:
      - opengl-python-build-deps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opengl-python-build-deps
          fetch-depth: 0
      - name: Patch contract
        run: python3 .github/scripts/patch_opengl_python_deps.py
      - name: Validate diff
        run: git diff --check
      - name: Commit contract
        run: |
          git config user.name "BuildEngine Mesa dependencies"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/opengl-python-build-deps.yml
          git rm .github/scripts/patch_opengl_python_deps.py
          git add admin/build-libraries.xml
          git diff --cached --check
          git commit -m "Pin Mesa Python configure dependencies"
          git push origin HEAD:opengl-python-build-deps
