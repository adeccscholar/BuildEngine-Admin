name: Apply Mesa BCC64X contract

on:
  push:
    branches:
      - mesa-bcc64x-contract
    paths:
      - .github/workflows/mesa-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mesa-bcc64x-contract
          fetch-depth: 0
      - name: Patch canonical contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin/programs/opengl/patch_contract.py')
          text = path.read_text(encoding='utf-8')
          old_sub = 'pattern.subn(mesa_block, text, count=1)'
          new_sub = 'pattern.subn(lambda _match: mesa_block, text, count=1)'
          if old_sub in text:
              text = text.replace(old_sub, new_sub)
          old_pattern = 'pattern = re.compile(r\'<library id="opengl"\\\\b.*?</library>\', re.DOTALL)'
          new_pattern = 'pattern = re.compile(r\'<library id="opengl".*?</library>\', re.DOTALL)'
          if old_pattern not in text:
              raise SystemExit('expected OpenGL selector not found')
          text = text.replace(old_pattern, new_pattern)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 admin/programs/opengl/patch_contract.py
      - name: Commit canonical contract
        shell: bash
        run: |
          git config user.name "BuildEngine contract update"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mesa-contract-patch.yml admin/programs/opengl/patch_contract.py
          git add admin/build-libraries.xml admin/programs/opengl/meson_bootstrap.py
          git diff --cached --check
          git commit -m "Build Mesa OpenGL natively with BCC64X"
          git push origin HEAD:mesa-bcc64x-contract
