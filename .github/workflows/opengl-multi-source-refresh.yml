name: Refresh OpenGL multi-source contract state

on:
  push:
    branches:
      - opengl-multi-source-refresh
    paths:
      - .github/workflows/opengl-multi-source-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opengl-multi-source-refresh
          fetch-depth: 0
      - name: Refresh OpenGL timestamp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin/build-libraries.xml')
          text = path.read_text(encoding='utf-8')
          old = '<library id="opengl" version="26.2.1" timestamp="2026-09-02T00:12:00Z">'
          new = '<library id="opengl" version="26.2.1" timestamp="2026-09-02T01:02:00Z">'
          if text.count(old) != 1:
              raise SystemExit(f'expected one OpenGL timestamp, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit timestamp refresh
        shell: bash
        run: |
          git config user.name "BuildEngine Admin contract"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/opengl-multi-source-refresh.yml
          git add admin/build-libraries.xml
          git diff --cached --check
          git commit -m "Refresh OpenGL multi-source extraction state"
          git push origin HEAD:opengl-multi-source-refresh
