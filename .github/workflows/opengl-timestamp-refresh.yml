name: Refresh Mesa OpenGL contract timestamp

on:
  push:
    branches:
      - opengl-timestamp-refresh
    paths:
      - .github/workflows/opengl-timestamp-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opengl-timestamp-refresh
          fetch-depth: 0
      - name: Refresh OpenGL contract timestamp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin/build-libraries.xml')
          text = path.read_text(encoding='utf-8')
          old = '<library id="opengl" version="26.2.1" timestamp="2026-09-01T23:21:00Z">'
          new = '<library id="opengl" version="26.2.1" timestamp="2026-09-02T00:12:00Z">'
          if text.count(old) != 1:
              raise SystemExit('OpenGL timestamp insertion point is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit timestamp
        shell: bash
        run: |
          git config user.name "BuildEngine contract update"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/opengl-timestamp-refresh.yml
          git add admin/build-libraries.xml
          git diff --cached --check
          git commit -m "Refresh Mesa OpenGL contract state"
          git push origin HEAD:opengl-timestamp-refresh
